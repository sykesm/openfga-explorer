# Local stack: OpenFGA backed by Postgres, and the explorer.
#
#   docker compose -f deploy/docker-compose.yml -p fgaexplorer up -d --build
#   make seed        # sample store (needs the fga CLI)
#   open http://127.0.0.1:8090
#
# Every port is published on 127.0.0.1 only: Postgres (5433), OpenFGA (8080
# HTTP, 8081 gRPC), and the explorer (8090). The containers reach each other
# over the compose network. To reach the explorer from another machine, set
# EXPLORER_PUBLISH (e.g. 0.0.0.0:8090) and put it behind an authenticating
# proxy: it has no authentication of its own.
services:
  postgres:
    image: postgres:18.7  # Debian/glibc: en_US collation behaves like most managed Postgres
    environment:
      POSTGRES_USER: openfga
      POSTGRES_PASSWORD: openfga
      POSTGRES_DB: openfga
    # A named volume, so data survives recreating the container. Postgres 18
    # images keep data under /var/lib/postgresql/18/docker; a major-version
    # upgrade needs a dump and restore (see README).
    volumes: ["pgdata:/var/lib/postgresql"]
    ports: ["127.0.0.1:5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openfga"]
      interval: 2s
      retries: 30
  migrate:
    image: openfga/openfga:v1.23.0
    command: migrate
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://openfga:openfga@postgres:5432/openfga?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }
  openfga:
    image: openfga/openfga:v1.23.0
    command: run
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://openfga:openfga@postgres:5432/openfga?sslmode=disable
      OPENFGA_PLAYGROUND_ENABLED: "false"
      # Large models for UI scale testing (the server default is 100 types).
      OPENFGA_MAX_TYPES_PER_AUTHORIZATION_MODEL: "1000"
    ports: ["127.0.0.1:8080:8080", "127.0.0.1:8081:8081"]
    depends_on:
      migrate: { condition: service_completed_successfully }
  explorer:
    build: { context: .., dockerfile: Dockerfile }
    environment:
      OPENFGA_API_URL: http://openfga:8080
      # Optional: read-only datastore access for search and exact counts.
      FGAX_DATASTORE_URI: postgres://openfga:openfga@postgres:5432/openfga?sslmode=disable
    ports: ["${EXPLORER_PUBLISH:-127.0.0.1:8090}:8090"]
    # The explorer's settings, written inline (below) over the file the image
    # carries (explorer.example.yaml). Edit them there and run
    # `docker compose ... up -d` again; no rebuild needed.
    configs:
      - source: explorer
        target: /etc/fgaexplorer/explorer.yaml
    depends_on:
      openfga: { condition: service_started }
configs:
  # The explorer's YAML configuration (see explorer.example.yaml for every
  # setting). The OpenFGA URL and the datastore come from the environment
  # above. Settings left out keep their defaults.
  explorer:
    content: |
      auth:
        identity_header: X-Forwarded-Email
        default_role: viewer
      # How the sample data's principal IDs are typed, stored, and shown.
      types:
        principal:
          trim: true
          case: upper
          encode: ":#= ,"
          display: decoded
          hint: "CN=Name, service account, or principal ID"
      # Admin-only queries over real data (the Access tab, "check real people").
      live_queries:
        enabled: true
        max_objects: 20
        max_checks: 1000
        timeout: 30s
        runs_per_hour: 10
      # Expanding the instance graph in place (Shift+click, +1 hop). Everyone
      # gets the first limits; admins (including anonymous requests with
      # --dangerously-treat-anonymous-as-admin) get those under admin.
      graph_expansion:
        enabled: true
        max_instances: 10     # instances per expansion
        max_reads: 200        # tuple-store reads per expansion
        timeout: 10s
        per_minute: 20        # expansions per person
        admin:
          max_instances: 20
          max_reads: 1000
          timeout: 30s
          per_minute: 60
      trace:
        max_calls: 250
        max_fanout: 25
        probe_limit: 25
        timeout: 15s
        max_concurrent: 8
volumes:
  pgdata:
